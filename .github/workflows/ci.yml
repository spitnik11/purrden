name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  phase0-domain:
    name: phase0-domain-art
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Spawn engine conformance
        run: python tools/conformance.py

      - name: Spawn property invariants
        run: python tools/test_property_spawn.py

      - name: Focus state machine
        run: python tools/test_focus.py

      - name: Install Art Factory deps
        run: pip install -r tools/art-factory/requirements.txt

      - name: Art license registry present
        run: python tools/art-factory/cli/art.py licenses | head -n 5

      - name: Art Factory unit tests
        run: python tools/art-factory/tests/test_art_factory.py

      - name: Comfy workflow validate
        run: python tools/art-factory/cli/art.py comfy validate

  phase1-web:
    name: phase1-web-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Offline loop smoke
        run: npm run smoke

      - name: DOM selector smoke
        run: npm run smoke:dom

      - name: Typecheck and production build
        run: npm run build

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Start browser test stack
        run: docker compose -f ../../deploy/compose/docker-compose.yml --profile production up -d --build web api postgres keycloak

      - name: Browser release gate
        env:
          PURRDEN_E2E_BASE_URL: http://127.0.0.1:8080
        run: npm run e2e

      - name: Named-account release gate
        env:
          PURRDEN_AUTH_E2E: "1"
        run: npm run e2e:auth

      - name: Stop browser test stack
        if: always()
        run: docker compose -f ../../deploy/compose/docker-compose.yml --profile production down --volumes

  phase2-api:
    name: phase2-api-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install --require-hashes -r requirements.lock
          pip install pytest

      - name: Pytest
        env:
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
          ENV: test
          PYTHONPATH: .
        run: python -m pytest tests/ -q

      - name: Python dependency audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.lock
